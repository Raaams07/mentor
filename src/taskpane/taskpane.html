<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MENTOR</title>
</head>
<body style="font-family:Segoe UI, sans-serif; padding:18px; font-size:13px; background:#f7f8fa;">

  <!-- MENTOR — calm, quiet presence. No inputs, no buttons, nothing to fill in. -->
  <h2 style="color:#1a1a2e; margin:0 0 6px 0; font-weight:600;">MENTOR</h2>
  <p style="color:#9aa0a6; font-size:11px; letter-spacing:0.5px; text-transform:uppercase; margin:0 0 20px 0;">
    An expert always beside you.
  </p>

  <!-- Sheet MENTOR doesn't recognize yet — asks once, remembers the answer -->
  <div id="mentor-sheet-memory-prompt" style="display:none; margin-bottom:10px;"></div>

  <!-- Ambiguous/missing GST column MENTOR can't confidently identify — blocks the reconciliation proposal below until resolved -->
  <div id="mentor-column-memory-prompt" style="display:none; margin-bottom:10px;"></div>

  <!-- GST reconciliation proposal — appears when GSTR-2A + Books sheets are detected -->
  <div id="mentor-gst-reconciliation-prompt" style="display:none; margin-bottom:10px;"></div>

  <!-- Point-and-explain — appears when a row is selected on a generated GST sheet -->
  <div id="mentor-gst-explain" style="display:none; margin-bottom:10px;"></div>

  <!-- Live suggestion feed — the only thing that ever actively appears -->
  <div id="mentor-suggestion"></div>

  <!-- Calm resting state — small, quiet, not a call-to-action -->
  <div id="mentor-empty-state" style="color:#c2c6cc; font-size:11px; margin-top:4px;">
    &nbsp;
  </div>

  <!-- Accepted/rejected results history, if reconciliation ever runs -->
  <div id="results"></div>

  <!-- MENTOR action history — a permanent, visible log of everything
       MENTOR has actually done, so it's never a mystery what happened. -->
  <div style="margin-top:24px; border-top:1px solid #e2e4e9; padding-top:10px;">
    <a href="#" id="mentor-history-toggle" onclick="mentorToggleHistory(); return false;"
       style="font-size:11px; color:#888; text-decoration:underline; cursor:pointer;">
      History (0)
    </a>
    <div id="mentor-history-list" style="display:none; margin-top:8px;">
      <div style="color:#c2c6cc; font-size:11px;">Nothing done yet.</div>
    </div>
  </div>

  <!-- What MENTOR has learned for this workbook (sheet identities, column
       mappings) — reviewable and editable/resettable directly here, no
       need to unhide the underlying memory sheets. -->
  <div style="margin-top:10px; border-top:1px solid #e2e4e9; padding-top:10px;">
    <a href="#" id="mentor-memory-review-toggle" onclick="mentorToggleMemoryReview(); return false;"
       style="font-size:11px; color:#888; text-decoration:underline; cursor:pointer;">
      Learned answers (0)
    </a>
    <div id="mentor-memory-review-list" style="display:none; margin-top:8px;">
      <div style="color:#c2c6cc; font-size:11px;">Nothing learned yet for this workbook.</div>
    </div>
  </div>

  <!-- Manual reconciliation tool — kept in the DOM so the existing
       script doesn't break on startup, but fully hidden. Not part of
       the visible product anymore. -->
  <div style="display:none;">
    <select id="ledger-select"><option value="">Loading sheets...</option></select>
    <select id="supplier-select"><option value="">Loading sheets...</option></select>
    <button id="reconcile-btn">Run Reconciliation</button>
  </div>

  <script src="https://appsforoffice.microsoft.com/lib/1.1/hosted/office.js" type="text/javascript"></script>
</body>
</html>
